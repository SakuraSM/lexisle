name: Build and package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build responsive web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        env:
          VITE_POCKETBASE_URL: https://pocket.nings.top
        run: npm run build

      - name: Test learning logic
        run: npm test

      - name: Test React pages
        run: npm run test:ui

      - name: Test Sites worker
        run: npm run test:sites

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile flows
        run: npm run test:e2e

      - name: Package static bundle
        working-directory: .
        run: tar -C "web/dist/client" -czf "lexisle-web.tar.gz" .

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: lexisle-web
          path: lexisle-web.tar.gz
          if-no-files-found: error
          retention-days: 14

  compose:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build responsive production image
        run: docker compose build

  pocketbase:
    name: PocketBase migration and sync flow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download PocketBase
        working-directory: .
        run: |
          curl -fsSL -o pocketbase.zip https://github.com/pocketbase/pocketbase/releases/download/v0.39.10/pocketbase_0.39.10_linux_amd64.zip
          unzip -q pocketbase.zip pocketbase
          chmod +x pocketbase

      - name: Apply migrations and start PocketBase
        working-directory: .
        run: |
          ./pocketbase migrate up --migrationsDir=pb_migrations
          ./pocketbase serve --http=127.0.0.1:8090 --migrationsDir=pb_migrations > pocketbase.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8090/api/health && break
            sleep 1
          done

      - name: Run registration and data recovery integration flow
        env:
          POCKETBASE_TEST_URL: http://127.0.0.1:8090
        run: node tests/pocketbase-live.mjs

  release:
    name: Publish GitHub release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - web
      - compose
      - pocketbase
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*/*.tar.gz --generate-notes --verify-tag
