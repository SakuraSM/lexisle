name: Build and package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build responsive web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint source and tests
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build production bundle
        env:
          VITE_POCKETBASE_URL: https://pocket.nings.top
        run: npm run build

      - name: Test learning logic
        run: npm test

      - name: Test React pages
        run: npm run test:ui

      - name: Test Sites worker
        run: npm run test:sites

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile flows
        run: npm run test:e2e

      - name: Package static bundle
        working-directory: .
        run: tar -C "web/dist/client" -czf "lexisle-web.tar.gz" .

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lexisle-web
          path: lexisle-web.tar.gz
          if-no-files-found: error
          retention-days: 14

  compose:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build responsive production image
        run: docker compose build

      - name: Validate Nginx runtime configuration
        run: docker run --rm lexisle-web:local nginx -t

      - name: Build PocketBase extension image
        run: docker compose --profile local-backend build pocketbase

  pocketbase:
    name: PocketBase migration and sync flow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download PocketBase
        working-directory: .
        run: |
          curl -fsSL -o pocketbase.zip https://github.com/pocketbase/pocketbase/releases/download/v0.39.10/pocketbase_0.39.10_linux_amd64.zip
          echo "67f68c8041dbb6a35fd7af5997ffc5063a7a7b96bf9df810360788f9e9975408  pocketbase.zip" | sha256sum -c -
          unzip -q pocketbase.zip pocketbase
          chmod +x pocketbase

      - name: Apply migrations and start PocketBase
        working-directory: .
        run: |
          ./pocketbase migrate up --migrationsDir=pb_migrations
          LEXISLE_AI_ENCRYPTION_KEY=ci-integration-encryption-key-12 LEXISLE_AI_ALLOW_HTTP=true ./pocketbase serve --http=127.0.0.1:8090 --migrationsDir=pb_migrations --hooksDir=pb_hooks > pocketbase.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:8090/api/health && break
            sleep 1
          done

      - name: Run registration and data recovery integration flow
        env:
          POCKETBASE_TEST_URL: http://127.0.0.1:8090
        run: node tests/pocketbase-live.mjs

      - name: Package PocketBase migrations and hooks
        working-directory: .
        run: tar -czf lexisle-pocketbase-extension.tar.gz pb_migrations pb_hooks

      - name: Upload PocketBase extension package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lexisle-pocketbase-extension
          path: lexisle-pocketbase-extension.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - web
      - compose
      - pocketbase
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*/*.tar.gz --generate-notes --verify-tag

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
