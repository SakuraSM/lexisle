name: Build and package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - desktop
          - mobile
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check protected runtime
        run: npm run check:runtime --if-present

      - name: Build production bundle
        env:
          VITE_POCKETBASE_URL: https://pocket.nings.top
        run: npm run build

      - name: Test Sites worker
        run: npm run test:sites

      - name: Package static bundle
        working-directory: .
        run: tar -C "${{ matrix.app }}/dist/client" -czf "zhiyu-english-${{ matrix.app }}.tar.gz" .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: zhiyu-english-${{ matrix.app }}
          path: zhiyu-english-${{ matrix.app }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  compose:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build both production images
        run: docker compose build

  release:
    name: Publish GitHub release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - web
      - compose
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/*/*.tar.gz --generate-notes --verify-tag
