<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知屿英语移动端登录设计 QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #171b3a; background: #eef0f6; font: 14px system-ui, sans-serif; }
      header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #fff; border-bottom: 1px solid #dfe2ec; }
      header strong { font-size: 16px; }
      header span { color: #69718a; font-size: 12px; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100vh - 56px); padding: 16px; }
      section { position: relative; min-width: 0; overflow: hidden; border: 1px solid #dfe2ec; border-radius: 14px; background: #fff; box-shadow: 0 8px 24px rgba(23,27,58,.08); }
      section > b { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 6px 9px; border-radius: 8px; color: #fff; background: rgba(23,27,58,.82); font-size: 11px; }
      img { width: 100%; height: 100%; object-fit: contain; }
      iframe { width: 160%; height: 160%; border: 0; transform: scale(.625); transform-origin: top left; }
    </style>
  </head>
  <body>
    <header><strong>移动端登录设计对比</strong><span>左：原视觉目标 · 右：PocketBase 登录实现</span></header>
    <main>
      <section><b>视觉基准</b><img src="/qa-reference-mobile.png" alt="知屿英语移动端视觉基准" /></section>
      <section><b>实现结果</b><iframe id="prototype" src="/?qa-auth=1" title="PocketBase 登录实现"></iframe></section>
    </main>
  </body>
</html>
